<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#0d1018"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a63a8"/>
      <stop offset="1" stop-color="#1c2f5c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="0.5" stop-color="#d9a43b"/>
      <stop offset="1" stop-color="#8a5a16"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9dcb8"/>
      <stop offset="1" stop-color="#bfa977"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a6ff"/>
      <stop offset="1" stop-color="#7a4fd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- icon frame -->
  <rect x="8" y="8" width="384" height="384" rx="44" fill="url(#bg)"/>
  <rect x="8" y="8" width="384" height="384" rx="44" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- the tome -->
  <g filter="url(#shadow)" transform="rotate(-8 190 200)">
    <!-- page block -->
    <rect x="118" y="92" width="168" height="220" rx="10" fill="url(#pages)"/>
    <g stroke="#a88f5c" stroke-width="2" opacity="0.7">
      <line x1="276" y1="104" x2="276" y2="300"/>
      <line x1="268" y1="102" x2="268" y2="302"/>
    </g>
    <!-- cover -->
    <rect x="96" y="80" width="176" height="232" rx="12" fill="url(#cover)"/>
    <!-- spine -->
    <rect x="96" y="80" width="30" height="232" rx="10" fill="#15244a"/>
    <rect x="96" y="118" width="30" height="8" fill="url(#gold)"/>
    <rect x="96" y="266" width="30" height="8" fill="url(#gold)"/>
    <!-- gold corners -->
    <path d="M272 80 h-40 a0 0 0 0 0 0 0 l40 40 z" fill="url(#gold)"/>
    <path d="M272 312 h-40 l40 -40 z" fill="url(#gold)"/>
    <!-- cover border -->
    <rect x="138" y="100" width="116" height="192" rx="6" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <!-- cover emblem: a star-rune -->
    <g transform="translate(196 196)" fill="url(#gold)">
      <path d="M0 -46 L11 -11 L46 0 L11 11 L0 46 L-11 11 L-46 0 L-11 -11 Z"/>
      <circle r="9" fill="#1c2f5c"/>
    </g>
  </g>

  <!-- pause badge, in Spoken's purple -->
  <g filter="url(#shadow)">
    <circle cx="292" cy="292" r="70" fill="url(#badge)" stroke="#f3eaff" stroke-width="8"/>
    <rect x="266" y="258" width="18" height="68" rx="5" fill="#ffffff"/>
    <rect x="300" y="258" width="18" height="68" rx="5" fill="#ffffff"/>
  </g>
</svg>
